[project]
name = "knowledge-base"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.18.1",
    "python-dotenv>=1.2.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "transformers>=4.45.0,<5.0.0",
    "pymilvus[model]>=3.0.2",
    "flagembedding>=1.3.5",
    "modelscope>=1.40.1",
    "hybrid-search>=0.0.15",
    "openai-agents>=0.22.3",
    "mcp>=1.19.0,<2",
    "dashscope>=1.27.7",
    "uvicorn[standard]>=0.54.0",
    "pypdf>=6.19.0",
]


[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
